<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1419" />
  <title>Entrar — App Lista</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="splash" id="splash">
    <img src="icon.svg" alt="App Lista" class="splash-icon" />
    <div class="splash-spinner"></div>
    <div class="splash-text">Carregando...</div>
  </div>

  <main class="auth-wrap">
    <div class="auth-logo">
      <div class="auth-logo-badge">
        <svg viewBox="0 0 24 24">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <h1>App Lista</h1>
      <p>Entre pra analisar suas conversas</p>
    </div>

    <div id="login-alert" class="alert"></div>

    <form id="login-form" autocomplete="on">
      <div class="form-group">
        <label for="email">Email</label>
        <input class="input" type="email" id="email" name="email" required autocomplete="email" placeholder="voce@empresa.com" />
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input class="input" type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••" />
      </div>

      <button type="submit" class="btn btn-primary">
        Entrar
        <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </form>

    <div class="auth-footer">
      Não tem conta? <a href="cadastro.html">Cadastre-se</a>
    </div>
  </main>

  <script type="module">
    import { supabase } from './js/supabase.js';
    import { initLogin } from './js/auth.js';
    import { registerPwa } from './js/pwa.js';

    registerPwa();

    // Se já estiver logado, pula pro app
    const { data: { session } } = await supabase.auth.getSession();
    if (session) { window.location.href = 'index.html'; } else {
      const s = document.getElementById('splash');
      if (s) { s.classList.add('hidden'); setTimeout(() => s.remove(), 400); }
    }

    initLogin();
  </script>
</body>
</html>
