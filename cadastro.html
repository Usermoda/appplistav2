<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1419" />
  <title>Cadastro — App Lista</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-logo">
      <div class="auth-logo-badge">
        <svg viewBox="0 0 24 24">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="8.5" cy="7" r="4"/>
          <line x1="20" y1="8" x2="20" y2="14"/>
          <line x1="23" y1="11" x2="17" y2="11"/>
        </svg>
      </div>
      <h1>Criar conta</h1>
      <p>É rápido. Só preencher.</p>
    </div>

    <div id="cadastro-alert" class="alert"></div>

    <form id="cadastro-form" autocomplete="on">
      <div class="form-group">
        <label for="nome">Nome</label>
        <input class="input" type="text" id="nome" name="nome" required autocomplete="name" placeholder="Seu nome" />
      </div>

      <div class="form-group">
        <label for="cargo">Cargo (opcional)</label>
        <input class="input" type="text" id="cargo" name="cargo" autocomplete="organization-title" placeholder="Ex: Analista de Vendas" />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input class="input" type="email" id="email" name="email" required autocomplete="email" placeholder="voce@empresa.com" />
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input class="input" type="password" id="password" name="password" required minlength="6" autocomplete="new-password" placeholder="Mínimo 6 caracteres" />
      </div>

      <div class="form-group">
        <label for="password2">Confirmar senha</label>
        <input class="input" type="password" id="password2" name="password2" required minlength="6" autocomplete="new-password" placeholder="Repita a senha" />
      </div>

      <button type="submit" class="btn btn-primary">
        Criar conta
        <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </form>

    <div class="auth-footer">
      Já tem conta? <a href="login.html">Entrar</a>
    </div>
  </main>

  <script type="module">
    import { initCadastro } from './js/auth.js';
    import { registerPwa } from './js/pwa.js';
    registerPwa();
    initCadastro();
  </script>
</body>
</html>
